[project]
name = "cscs-pytorch-course"
version = "0.0.0"
description = "Executable material for the CSCS three-day PyTorch course"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
]

[project.optional-dependencies]
cpu = [
  "torch==2.11.0",
]
cuda = [
  "torch==2.11.0",
]

[project.scripts]
course = "pytorch_course.cli:main"

[dependency-groups]
dev = [
  "nodeenv>=1.9,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "shtab>=1.7,<2",
]
notebooks = [
  "ipykernel>=6.29,<8",
  "matplotlib>=3.10,<4",
  "jupytext>=1.17,<2",
  "jupyterlab>=4.4,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytorch_course", "lessons"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
default-groups = ["dev", "notebooks"]
required-version = ">=0.12.0"
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
